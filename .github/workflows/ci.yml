name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: whitejack-ui/package-lock.json
      - name: Type-check the UI
        working-directory: whitejack-ui
        run: npm ci && npm run lint
      - name: Build and test (UI is bundled into the server jar)
        run: ./gradlew build
