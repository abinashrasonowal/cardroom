# Local run:  docker compose up --build   →   http://localhost:8080
#
# Rooms live in memory (architecture §2), so a restart ends every game in progress. Run a
# single replica: two containers would each hold half the rooms.
services:
  whitejack:
    build: .
    image: whitejack:latest
    ports:
      - "${WHITEJACK_PORT:-8080}:8080"
    environment:
      # Signs the identity cookie. Set it so players keep their seats across restarts;
      # left empty, the server makes a random one per boot and logs a warning.
      WHITEJACK_COOKIESECRET: ${WHITEJACK_COOKIE_SECRET:-}
      # Cross-origin WebSocket handshakes to allow (same-origin always works).
      WHITEJACK_ALLOWEDORIGINS: ${WHITEJACK_ALLOWED_ORIGINS:-http://localhost:*}
      # OpenRouter key for the Jev bots; left empty, bots still play, on heuristics alone.
      WHITEJACK_BOTS_OPENROUTERAPIKEY: ${OPENROUTER_API_KEY:-}
      WHITEJACK_BOTS_MODEL: ${WHITEJACK_BOTS_MODEL:-typesafe/jev-router}
    restart: unless-stopped
